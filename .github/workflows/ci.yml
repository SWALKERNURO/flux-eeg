name: Validate application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
      - run: npm audit --audit-level=low
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the locked Electron runtime
        run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
      - name: Build the unsigned Windows installer
        run: npm run desktop:build
      - name: Smoke-test the packaged application
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'installer-output/win-unpacked/Flux EEG.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged desktop smoke test failed: $($process.ExitCode)" }
